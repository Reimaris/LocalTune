name: Build Windows Executable & Standalone Bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload asset to'
        required: false
        default: 'v2.6.4-rc.2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows-bundle:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller & Launcher Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows_launcher/requirements.txt

      - name: Build LocalTune.exe with PyInstaller
        run: |
          cd windows_launcher
          pyinstaller --noconfirm --onefile --windowed --icon="icon.ico" --add-data "icon.ico;." --add-data "icon.png;." --hidden-import="tkinter" --hidden-import="tkinter.ttk" --hidden-import="tkinter.filedialog" --hidden-import="tkinter.messagebox" --name "LocalTune" localtune.py

      - name: Create Staging Directory Structure
        run: |
          New-Item -ItemType Directory -Force -Path "staging\LocalTune\bin"
          New-Item -ItemType Directory -Force -Path "staging\LocalTune\runtime"
          New-Item -ItemType Directory -Force -Path "staging\LocalTune\config\logs"
          New-Item -ItemType Directory -Force -Path "staging\LocalTune\downloads"
          Copy-Item "windows_launcher\dist\LocalTune.exe" -Destination "staging\LocalTune\"
          Copy-Item -Recurse "windows_launcher" -Destination "staging\LocalTune\"
          Copy-Item -Recurse "app" -Destination "staging\LocalTune\"
          Copy-Item "requirements.txt" -Destination "staging\LocalTune\"
          Copy-Item "README.md" -Destination "staging\LocalTune\"
          Copy-Item "LICENSE" -Destination "staging\LocalTune\"

      - name: Download & Provision Embedded Python Runtime
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "staging\LocalTune\runtime" -Force
          Remove-Item "python-embed.zip"

          Set-Content -Path "staging\LocalTune\runtime\python312._pth" -Encoding Ascii -Value "python312.zip`r`n.`r`n..`r`nLib\site-packages`r`nimport site"
          python -m pip install --no-cache-dir pip -r requirements.txt --target "staging\LocalTune\runtime\Lib\site-packages"

      - name: Download & Provision Bundled External Binaries (ffmpeg & deno)
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "staging\LocalTune\bin\"
          Copy-Item $ffprobeExe.FullName -Destination "staging\LocalTune\bin\"
          Remove-Item -Recurse -Force "ffmpeg_extracted", "ffmpeg.zip"

          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno_extracted" -Force
          Copy-Item "deno_extracted\deno.exe" -Destination "staging\LocalTune\bin\"
          Remove-Item -Recurse -Force "deno_extracted", "deno.zip"

      - name: Compress Standalone All-in-One Archive
        run: |
          Compress-Archive -Path "staging\LocalTune\*" -DestinationPath "LocalTune-Windows-x64.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalTune_Windows_Bundle
          path: |
            windows_launcher/dist/LocalTune.exe
            LocalTune-Windows-x64.zip
          if-no-files-found: error

      - name: Attach Assets to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") {
            "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.tag }}" -ne "") {
            "${{ github.event.inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          Write-Host "Attaching LocalTune-Windows-x64.zip to release tag: $tag"
          gh release upload $tag LocalTune-Windows-x64.zip --clobber


