name: Build Windows Executable

on:
  push:
    branches:
      - main
    paths:
      - 'windows_manager/**'
      - '.github/workflows/build_windows_exe.yml'
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows_manager/requirements.txt

      - name: Build LocalTune_Manager.exe with PyInstaller
        run: |
          cd windows_manager
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --icon="icon.ico" --add-data "icon.ico;." --add-data "icon.png;." --name "LocalTune_Manager" localtune_manager.py

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalTune_Manager_Windows
          path: windows_manager/dist/LocalTune_Manager.exe
          if-no-files-found: error

      - name: Attach Executable to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows_manager/dist/LocalTune_Manager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
