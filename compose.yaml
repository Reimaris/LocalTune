services:
  localtune:
    image: ghcr.io/reimaris/localtune:latest
    container_name: localtune
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./downloads:/downloads
    environment:
      - DATABASE_URL=sqlite:////app/config/localtune.db
    restart: unless-stopped
