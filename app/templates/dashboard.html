{% extends "base.html" %}

{% block content %}
<!-- Stat Cards -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <!-- Queue Card -->
    <div class="bg-[#24242b] border border-[#3f3f46] rounded-xl shadow-lg overflow-hidden flex flex-col">
        <div class="bg-gradient-to-r from-[#d40060] to-[#9d0047] p-4 flex items-center justify-between">
            <div class="flex items-center gap-2 text-white">
                <h2 class="text-lg font-bold tracking-wider uppercase">Downloads</h2>
            </div>
            <div class="text-2xl font-light text-white">0</div>
        </div>
        <div class="grid grid-cols-3 divide-x divide-[#3f3f46] bg-[#1e1e24] flex-1">
            <div class="p-4 flex flex-col items-center justify-center">
                <div class="text-xs text-[#a1a1aa] uppercase tracking-wider mb-1 font-semibold">Queued</div>
                <div class="text-2xl font-medium text-white">0</div>
            </div>
            <div class="p-4 flex flex-col items-center justify-center">
                <div class="text-xs text-[#a1a1aa] uppercase tracking-wider mb-1 font-semibold">Done</div>
                <div class="text-2xl font-medium text-emerald-500">0</div>
            </div>
            <div class="p-4 flex flex-col items-center justify-center">
                <div class="text-xs text-[#a1a1aa] uppercase tracking-wider mb-1 font-semibold">Errors</div>
                <div class="text-2xl font-medium text-red-500">0</div>
            </div>
        </div>
    </div>
</div>

<!-- Main Table Area -->
<div class="bg-[#24242b] border border-[#3f3f46] rounded-lg shadow overflow-hidden" x-data="{ tab: 'all', search: '', showStatus: false }">
    
    <!-- Table Toolbar: Tabs & Search -->
    <div class="p-4 border-b border-[#3f3f46] flex flex-col md:flex-row justify-between items-center gap-4">
        <!-- Tabs -->
        <div class="flex gap-2 bg-[#1e1e24] p-1 rounded-lg border border-[#3f3f46]">
            <button @click="tab = 'all'; search = ''" :class="{'bg-[#d40060] text-white': tab === 'all', 'text-[#a1a1aa] hover:text-white': tab !== 'all'}" class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors">All Tracks</button>
        </div>

        <!-- Search & Status -->
        <div class="flex items-center gap-4 w-full md:w-auto">
            <div class="relative w-full md:w-64">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#a1a1aa]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" x-model="search" placeholder="Search..." class="w-full bg-[#111115] border border-[#3f3f46] focus:border-[#d40060] rounded-lg pl-9 pr-4 py-2 text-white focus:outline-none transition-colors text-sm">
            </div>
        </div>
    </div>

    <!-- Download Table -->
    <div class="overflow-x-auto min-h-[400px]">
        <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead class="bg-[#2a2a32] text-[#d1d5db] font-semibold text-sm border-b border-[#3f3f46]">
                <tr>
                    <th class="px-6 py-4">Title</th>
                    <th class="px-6 py-4">Artist</th>
                    <th class="px-6 py-4">Status</th>
                    <th class="px-6 py-4">Source URL</th>
                    <th class="px-6 py-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-[#3f3f46] text-sm">
                <!-- Example Row -->
                <tr class="hover:bg-[#2a2a32] transition-colors group">
                    <td class="px-6 py-4">
                        <div class="block">
                            <span class="font-bold text-white">No tracks downloaded yet.</span>
                        </div>
                    </td>
                    <td class="px-6 py-4"></td>
                    <td class="px-6 py-4"></td>
                    <td class="px-6 py-4"></td>
                    <td class="px-6 py-4"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
