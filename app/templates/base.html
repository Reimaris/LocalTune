<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalTune</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- AlpineJS for basic interactions like modals/tabs if needed -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            background-color: #1e1e24;
            color: #d1d5db;
        }
        .nav-link {
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="bg-[#2a2a32] border-b border-[#3f3f46] shadow-md sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                
                <!-- Left side: Brand -->
                <div class="flex items-center gap-3">
                    <img src="/static/icon.svg" alt="LocalTune Logo" class="w-11 h-11 shrink-0">
                    <a href="/" class="text-lg font-semibold text-white tracking-wide">LocalTune</a>
                    <span class="bg-[#3f3f46] text-[#a1a1aa] text-[10px] px-2 py-0.5 rounded-full font-mono ml-2 mt-0.5">
                        v2.3.0
                    </span>
                </div>

                <!-- Right side: Navigation Links -->
                <div class="flex items-center gap-6 text-sm text-[#a1a1aa] font-medium">
                    <a href="/" class="nav-link flex items-center gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                        Dashboard
                    </a>
                    <a href="/settings" class="nav-link flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Settings
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Global Alerts (Sync results etc) -->
    <div id="global-alert" class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 mt-4 empty:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
