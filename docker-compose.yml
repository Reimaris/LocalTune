
services:
  web:
    build: .
    container_name: localtune_web
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./downloads:/downloads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/config/localtune.db
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: localtune_worker
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "downloads"]
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./downloads:/downloads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/config/localtune.db
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: localtune_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  log_collector:
    build: .
    container_name: localtune_log_collector
    command: ["python", "-u", "/app/app/log_collector.py"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/app/config
    depends_on:
      - redis
    restart: unless-stopped
